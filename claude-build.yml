name: Claude Autonomous Build

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Trigger on:
    # 1. Issue assigned to claude-bot
    # 2. Comment containing "approved, proceed" on an issue or PR
    if: |
      (github.event_name == 'issues' && contains(github.event.assignees.*.login, 'claude-bot')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'approved, proceed')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, 'approved, proceed'))

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      issues: write
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: splitwise
          POSTGRES_PASSWORD: splitwise
          POSTGRES_DB: splitwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >
            --model claude-sonnet-4-6
            --max_turns 50
          custom_instructions: |
            You are working on the Splitwise clone project.
            Always read CLAUDE.md before taking any action.
            Follow the autonomous workflow exactly as described in CLAUDE.md.
            The approval gate is real — stop and wait when CLAUDE.md says to stop.
            Never merge PRs. Only open them.
            Run npm test and npm run lint before opening any PR.
            If tests fail, fix the code, not the tests (unless the test itself is wrong).
        env:
          DATABASE_URL: postgresql://splitwise:splitwise@localhost:5432/splitwise_test
          NODE_ENV: test
